name: Validate Repository Structure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if docs folder exists
        run: |
          if [ -d "docs" ]; then
            echo " docs folder exists!"
          else
            echo " docs folder is missing!"
            exit 1
          fi
      
      - name: Check if docs folder has files
        run: |
          if [ "$(ls -A docs)" ]; then
            echo " docs folder contains files!"
          else
            echo " docs folder is empty!"
            exit 1
          fi
      
      - name: List contents of docs folder
        run: |
          echo " Files in /docs folder:"
          ls -la docs/
      
      - name: Check for ERD diagram
        run: |
          if ls docs/*.png 1> /dev/null 2>&1 || ls docs/*.jpg 1> /dev/null 2>&1; then
            echo " ERD diagram found!"
          else
            echo " No image file found in /docs (PNG or JPG)"
          fi
      
      - name: Check for SQL script
        run: |
          if ls docs/*.sql 1> /dev/null 2>&1; then
            echo " SQL script found!"
          else
            echo " No SQL script found in /docs"
            exit 1
          fi
      
      - name: Check for documentation files
        run: |
          if ls docs/*.md 1> /dev/null 2>&1 || ls docs/*.docx 1> /dev/null 2>&1 || ls docs/*.pdf 1> /dev/null 2>&1; then
            echo " Documentation files found!"
          else
            echo " No documentation files found (MD, DOCX, or PDF)"
          fi
      
      - name: Final validation summary
        run: |
          echo " docs folder exists: YES"
          echo " docs folder has files: YES"
          echo " ERD diagram: $([ -f docs/*.png ] 2>/dev/null && echo 'YES' || echo 'CHECK')"
          echo " SQL script: $([ -f docs/*.sql ] 2>/dev/null && echo 'YES' || echo 'NO')"
         
